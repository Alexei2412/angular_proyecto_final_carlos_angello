<mat-sidenav-container class="app-container">
  <mat-sidenav
    #sidenav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    class="app-sidenav"
  >
    <div class="sidenav-header">
      <mat-icon>school</mat-icon>
      <span>UMES</span>
    </div>
    <mat-nav-list>
      @for (item of menu; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          (click)="isHandset() && sidenav.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="app-toolbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Abrir menú">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span>Sistema de gestión de inscripciones</span>
    </mat-toolbar>

    @if (catalogService.hasError()) {
      <div class="catalog-error">
        <mat-icon>error</mat-icon>
        No se pudieron cargar uno o más catálogos (public/data). Revise que los archivos JSON
        existan.
      </div>
    }

    <main class="page-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
